[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mermaid-to-umlet"
version = "0.2.0"
description = "Convert Mermaid classDiagram source to editable UMLet UXF files"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
mermaid-to-umlet = "mermaid_to_umlet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
